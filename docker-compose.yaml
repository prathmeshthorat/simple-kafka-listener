version: "3.8"

services:
  kafka:
    image: apache/kafka:latest # Or your specific Kafka image
    container_name: kafka # Or the name you prefer
    hostname: kafka
    ports:
      # Map Kafka's internal port 9092 to host port 9092
      - "9092:9092"
      # Add other ports if needed (e.g., Zookeeper if not using KRaft, broker internal ports if clustered)
      # - "29092:29092" # Example for another listener
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT" # Adjust as needed
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092" # Important: kafka:29092 for inter-container, localhost:9092 for host access
      KAFKA_PROCESS_ROLES: "broker,controller" # Or 'broker,controller' if combined mode (KRaft)
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093" # KRaft Example
      KAFKA_LISTENERS: "CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092" # KRaft Example - Listen on different ports internally and externally
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/tmp/kafka-logs"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # Dev setup
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0 # Dev setup
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1 # Dev setup
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1 # Dev setup
      # Add Zookeeper env vars if you are *not* using KRaft
      # KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
    # Add Zookeeper service definition here if needed
    networks:
      - kafka-net # Connect to the custom network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      # Map Kafka UI's internal port 8080 to a host port (e.g., 8088)
      - "8088:8080"
    environment:
      # --- Cluster 1 Configuration ---
      KAFKA_CLUSTERS_0_NAME: "local-docker-kafka" # Choose a display name
      # Connect to the Kafka service name 'kafka' on its *internal* port (e.g., 29092 if configured, or 9092 if that's the internal PLAINTEXT listener)
      # *** Crucial: Use the Kafka service name 'kafka' and the port Kafka listens on *within* the docker network ***
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092" # Adjust port based on your KAFKA_LISTENERS/ADVERTISED_LISTENERS
      # Add Zookeeper if your Kafka setup requires it and Kafka UI needs it
      # KAFKA_CLUSTERS_0_ZOOKEEPER: 'zookeeper:2181'
      # Add authentication details if your Kafka cluster uses them
      # KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: 'SASL_SSL'
      # KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: 'PLAIN'
      # KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="user" password="password";'
    depends_on:
      - kafka # Wait for kafka service to start (basic check)
    networks:
      - kafka-net # Connect to the same custom network

networks:
  kafka-net: # Define the custom network
    driver: bridge
# Add Zookeeper service here if you are using it
